[project]
name = "vigilant-crypto-snatch"
version = "5.9.3"
description = "Crypto currency buying agent"
authors = [{ name = "Martin Ueding", email = "mu@martin-ueding.de" }]
requires-python = ">=3.9,<4,<3.13,!=3.9.7"
license = "MIT"
dependencies = [
    "bitstampclient>=2.2.10,<3",
    "appdirs>=1.4.4,<2",
    "coloredlogs>=15.0.1,<16",
    "pyyaml>=6.0,<7",
    "requests>=2.28.2,<3",
    "sqlalchemy>=2.0.9,<3",
    "krakenex>=2.1.0,<3",
    "python-dateutil>=2.8.2,<3",
    "click>=8.1.3,<9",
    "ccxt>=3.0.72,<4",
    "pandas>=1.0,<2",
    "scipy>=1.10.1,<2",
    "streamlit>=1.21.0,<2",
    "altair>=4.2.2,<5",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5.0,<7"]

[project.scripts]
vigilant-crypto-snatch = "vigilant_crypto_snatch.cli:main"
vigilant-crypto-snatch-qt = "vigilant_crypto_snatch.qtgui.__main__:main"

[dependency-groups]
dev = [
    "mkdocs-material>=9.1.6,<10",
    "pytest>=7.3.1,<8",
    "coverage>=7.2.3,<8",
    "pre-commit>=3.2.2,<4",
    "types-pyyaml>=6.0.12.9,<7",
    "types-requests>=2.28.11.17,<3",
    "types-python-dateutil>=2.8.19.12,<3",
    "sqlalchemy-stubs>=0.4,<0.5",
]

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"

[tool.mypy]
ignore_missing_imports = true
