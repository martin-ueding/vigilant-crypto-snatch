[project]
name = "vigilant-crypto-snatch"
version = "5.9.3"
description = "Crypto currency buying agent"
authors = [{ name = "Martin Ueding", email = "mu@martin-ueding.de" }]
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
    "altair>=6.0.0",
    "appdirs>=1.4.4",
    "bitstampclient>=2.2.10",
    "ccxt>=4.5.38",
    "click>=8.3.1",
    "coloredlogs>=15.0.1",
    "krakenex>=2.2.2",
    "pandas>=2.3.3",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "scipy>=1.17.0",
    "sqlalchemy>=2.0.46",
    "streamlit>=1.54.0",
]

[project.optional-dependencies]
gui = ["pyside6>=6.10.2"]

[project.scripts]
vigilant-crypto-snatch = "vigilant_crypto_snatch.cli:main"
vigilant-crypto-snatch-qt = "vigilant_crypto_snatch.qtgui.__main__:main"

[dependency-groups]
dev = [
    "mkdocs-material>=9.1.6",
    "pytest>=7.3.1",
    "types-pyyaml>=6.0.12.9",
    "types-requests>=2.28.11.17",
    "types-python-dateutil>=2.8.19.12",
    "sqlalchemy-stubs>=0.4,<0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
ignore_missing_imports = true

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "uv"
